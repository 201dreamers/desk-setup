[opener]
default = [
    { run = 'open %s', desc = "Open with default app" }
]

cursor = [
    { run = 'cursor %s', orphan = true, desc = "Cursor" }
]

chrome = [
    { run = 'open -a "Google Chrome" %s', orphan = true, desc = "Google Chrome" }
]

numbers = [
    { run = 'open -a "Numbers" %s1', desc = "Open with Numbers", orphan = true }
]

mdv = [
    { run = 'open -a "MDV" %s', desc = "Open with MDV", orphan = true }
]

[open]
rules = [
    { url = "*.md", use = [ "edit", "mdv", "cursor", "default" ], block = true },
    { url = "*.txt", use = [ "edit", "cursor", "default" ], block = true },
    { url = "*.csv", use = [ "edit", "numbers", "cursor", "default" ], block = true },
    { url = "*.numbers", use = [ "numbers", "default" ], block = true },

    { mime = "text/html", use = [ "edit", "chrome", "cursor", "default" ], block = true },
    { mime = "application/json", use = [ "edit", "cursor", "chrome", "default" ], block = true },
    { mime = "text/*", use = [ "edit", "cursor", "default" ], block = true },
    { mime = "video/*", use = [ "chrome", "reveal", "default" ], block = true },
    { mime = "image/*", use = [ "reveal", "chrome", "default" ], block = true },
    { mime = "application/x-empty", use = [ "edit", "default" ], block = true },

    { url = "*", use = [ "default" ], block = true }
]
