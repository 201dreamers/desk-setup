# Turn on status bar alerts for activity
set -g monitor-activity on

# Display a prominent flash/text message in the status bar 
set -g visual-activity on

# Extend how long tmux status messages stay on screen (e.g., 4 seconds)
set -g display-time 4000

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run "${HOME}/.config/tmux/plugins/tpm/tpm"

# ##########################################
# Tab blinker
# (must stay after tpm: overrides catppuccin)
# ##########################################
# The blink phase comes from strftime %S, so the status line has to redraw every second.
set -g status-interval 1

# Fallback signal: any program that rings the terminal bell (codex, gemini-cli, a
# plain `printf '\a'`) sets window_bell_flag, which blinks the tab too.
set -g monitor-bell on
set -g visual-bell off
set -g bell-action other

# The two tab renderings. Kept in options so the commas inside #[...] never have
# to be escaped in the conditional below.
set -g @ws_normal "#[fg=#11111b,bg=#{@thm_overlay_2}] #I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W "
set -g @ws_alert  "#[fg=#11111b,bg=#{@thm_red},bold] #I #[fg=#11111b,bg=#{@thm_peach},bold]  #W "

# Blink when @ai_wait (set by tab-blink.sh / agent hooks) or a pending bell is present:
# odd second -> alert colours, even second -> normal. strftime expands %S before
# tmux expands the format, so this spawns no shell.
set -g window-status-format "#{?#{?#{||:#{@ai_wait},#{window_bell_flag}},#{m:*[13579],%S},0},#{E:@ws_alert},#{E:@ws_normal}}"

# Looking at the window means you saw it: drop the flag.
set-hook -g after-select-window 'set -uw @ai_wait'
set-hook -g pane-focus-in       'set -uw @ai_wait'
# ##############################################
# End AI agent "waiting for input" tab blinker
# ##############################################
